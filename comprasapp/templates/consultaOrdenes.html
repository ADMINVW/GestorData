{% extends "base.html" %} {% block titulo %}Consultar Ordenes{% endblock %}
{% block contenido %}

    
        <div class="col-12 col-md-10 offset-md-1">
            <form id="form-consulta" class="form-horizontal" method="post">
                {% csrf_token %}
                <div class="card card-info">
                    <div class="card-header">
                        <h3 class="card-title">Consulta Ordenes de Compras</h3>
                    </div>
                    <div class="card-body">
                        <div class="form-group row">
                            <label for="codAgencia" class="col-sm-2 col-form-label">Agencia</label>

                            <div class="col-sm-4">
                                <select class="form-select" id="codAgencia" name="ncodAge">
                                    <option value="">Seleccione una de agencia</option>
                                </select>
                            </div>

                            <label for="codDivision" class="col-sm-2 col-form-label">Division</label>
                            <div class="col-sm-4">
                                <select class="form-select" id="codDivision" name="ncodDiv">
                                    <option value="">Seleccione una Division</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-group row mt-3">
                            <label for="codProveedor" class="col-sm-2 col-form-label">Proveedor</label>
                            <div class="col-sm-2">
                                <input type="text" class="form-control" id="codProveedor" name="ncodProv" />
                            </div>
                            <div class="col-sm-8">
                                <input type="text" class="form-control" id="nomProveedor" name="nnomProveedor" />
                            </div>
                        </div>

                        <div class="form-group row mt-3">
                            <label for="numOrden" class="col-sm-2 col-form-label">Orden Compra N°</label>
                            <div class="col-sm-2">
                                <input type="text" class="form-control" id="numOrden" value="" name="numOrden" />
                            </div>
                        </div>

                        <div class="form-group row mt-3">
                            <label for="numFactura" class="col-sm-2 col-form-label">Factura</label>
                            <div class="col-sm-2">
                                <input type="text" class="form-control" id="numFactura" value="" name="nnumFac" />
                            </div>
                        </div>
                        <div class="form-group row mt-3">
                            <label for="numOrdenTaller" class="col-sm-2 col-form-label">Orden de Trabajo N°
                            </label>
                            <div class="col-sm-2">
                                <input type="text" class="form-control" id="numOrdenTaller" />
                            </div>
                        </div>

                        <div class="form-group row mt-3">
                            <label for="fecIngresoIni" class="col-sm-2 col-form-label">Fecha Ingreso
                            </label>
                            <div class="col-sm-2">
                                <input type="text" onfocus="(this.type='date')" class="form-control" id="fecIngresoIni"
                                    onblur="if(!this.value) this.type='text'" />
                            </div>
                            <div class="col-sm-1 align-items-center"> al </div>
                            <div class="col-sm-2">
                                <input type="text" onfocus="(this.type='date')" class="form-control" id="fecIngresoFin"
                                    onblur="if(!this.value) this.type='text'" />
                            </div>

                        </div>
                        <hr class="hr hr-blurry my-5" />
                        <div class="container">
                            <div class="row">
                                <div class="col-sm-12 col-md-12 col-lg-12 col-xl-12">
                                    <div class="table-responsive">
                                        <table id="datatable-consultaoc" class="table">
                                            <thead>
                                                <tr>
                                                    <th>Agencia</th>
                                                    <th>División</th>
                                                    <th>Proveedor</th>
                                                    <th>Numero</th>
                                                    <th>Factura</th>
                                                    <th>Orden Taller</th>
                                                    <th>Fecha Ingreso</th>
                                                    <th></th>
                                                </tr>
                                            </thead>
                                            <tbody id="tablebody_ordenes">

                                            </tbody>
                                        </table>
                                    </div>
                                </div>

                            </div>

                        </div>
                    </div>
                    <div class="card-footer">
                        <!-- type="button" solo ejecuta el onclick sin enviar el formulario o recargar pagina esto lo hace con type ="submit"-->
                        <button class="btn btn-primary" type="button" id="consultar-btn"
                            onclick="iniciarDataTable()">Consultar</button>
                        <a class="btn btn-danger" role="button" href="{% url 'mimenu' %}" id="cancelar-btn">Cancelar</a>
                    </div>
                </div>
            </form>
        </div>
    

{% endblock %} {% block footer_scripts %}

<script src="/static/js/funcionesConsulta.js" defer></script>
{% endblock %}
