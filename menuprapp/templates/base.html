{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block titulo %} {% endblock %}</title>

  <!-- Google Font: Source Sans Pro -->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback" />
  <!-- Bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
  <!-- Estilos Propios -->
  <link rel="stylesheet" type="text/css" href="/static/css/componentes.css" />
  <!--Datatables-->
  <link rel="stylesheet" href="https://cdn.datatables.net/2.3.2/css/dataTables.bootstrap5.css" />
  <!--Font Awesone-->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
  <!--Autocomplete-->
  <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">
</head>

<body class="hold-transition layout-top-nav">
  <div class="wrapper">
    {% include "menuBarraNav.html" %}

    <!-- Content Wrapper. Contains page content -->
    <div class="content-wrapper">
      <!-- Content Header (Page header) -->
      <div class="content-header">
        <div class="container">
          <br />
          <div class="container-fluid">
              <div class="row">
                {% block cabcontenido %}
                    <!-- Content Header (Page header) -->
                    <!-- /.content -->
                    {% endblock %}
              </div>
          </div>
        </div>
        <!-- /.container-fluid -->
      </div>
      <!-- /.content-header -->

      <!-- Main content -->
      <div class="content">
        <div class="container">
          <div class="row">{% block contenido %} {% endblock %}</div>
          <!-- /.row -->
        </div>
        <!-- /.container-fluid -->
      </div>
      <!-- /.content -->
    </div>
    <!-- /.content-wrapper -->

    <!-- Control Sidebar -->
    <aside class="control-sidebar control-sidebar-dark">
      <!-- Control sidebar content goes here -->
    </aside>
    <!-- /.control-sidebar -->
    {% include 'footer.html' %}
  </div>
  <!-- ./wrapper -->

  <!--Estaban en head, habra q hacer pruebas q todo funciona -->
  <script>
    // Guardar company_key en sessionStorage para usarlo en fetch
    var ck = "{{ company_key|default:'' }}";
    if (ck) {
      sessionStorage.setItem('company_key', ck);
      // Actualizar links del navbar con company_key
      var ckNav = sessionStorage.getItem('company_key');
      if (ckNav) {
        document.querySelectorAll('.navbar a[href]').forEach(function (link) {
          var href = link.getAttribute('href');
          if (href && href !== '#' && !href.includes('company=') && !href.includes('company_select')) {
            link.setAttribute('href', href + (href.includes('?') ? '&' : '?') + 'company=' + ckNav);
          }
        });
      }
    }
  </script>
  <!-- Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>
  <!-- jQuery> -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <!-- Autocomplete-->
  <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
  <!-- Sweetalert ventanas de dialogo-->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!---->

  <!--JS Datatables-->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.datatables.net/2.3.2/js/dataTables.js"></script>
  <script src="https://cdn.datatables.net/2.3.2/js/dataTables.bootstrap5.js"></script>
  <!--JS propios-->
  <script src="/static/js/funciones.js" defer></script>
  {% block footer_scripts %} {% endblock %}
</body>


<div id="ventana_modal" class="modal fade" role="dialog"></div>

<script>
  function abrir_modal(url) {
    $('#ventana_modal').load(url, function () {
      $(this).modal({
        backdrop: 'static',  //impide que se cierre con la tecla escape 
        keyboard: false //impide que se cierre cuando haces click fuera del modal 

      })
      $(this).modal('show');
    });
    return false;
  }

  function cerrar_modal() {
    $('#ventana_modal').modal('hide');
    return false;
  }
</script>

</html>
